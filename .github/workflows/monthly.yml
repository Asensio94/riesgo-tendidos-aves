name: Rebuild risk maps

# Recomputes every region on the 2nd of each month (or on demand) and publishes output/ on GitHub Pages.
# Movebank is skipped in CI: downloads of hundreds of MB and the repository's dropped connections do not
# fit in a runner; it can be run locally and the cache uploaded as an artifact if needed.
on:
  schedule:
    - cron: "17 4 2 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore the download cache (GBIF, OSM, terrain)
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: cache-${{ github.run_id }}
          restore-keys: cache-
      - name: Compute the regions
        run: |
          # if one region fails (Overpass/GBIF down) the others and the project website are still published
          for region in estrecho cantabria; do
            python -m birdrisk.cli run --region "$region" || echo "::warning::region $region failed"
          done
          python -m birdrisk.cli index
      - name: Save the download cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: cache-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

  publish:
    needs: compute
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
